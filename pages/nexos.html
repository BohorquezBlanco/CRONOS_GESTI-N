<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SAMUS - Miembros USIP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #e6f2e6;
    }

    .navbar {
      background-color: #155724 !important;
    }

    .navbar-brand {
      color: #d4edda !important;
      font-weight: bold;
    }

    .titulo {
      color: #155724;
      font-weight: bold;
    }

    /* Tarjeta de miembro */
    .card-usip {
      border: none;
      border-radius: 1rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.2s ease;
    }

    .card-usip:hover {
      transform: translateY(-5px);
    }

    /* Imagen ovalada */
    .foto-usip {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #19692c;
      margin-top: -70px;
      background-color: #fff;
    }

    .card-header-usip {
      background-color: #19692c;
      height: 80px;
      border-top-left-radius: 1rem;
      border-top-right-radius: 1rem;
    }

    .nombre {
      color: #19692c;
      font-weight: bold;
    }

    .cargo {
      font-size: 0.9rem;
      color: #155724;
    }

    .periodo {
      font-size: 0.85rem;
      color: #6c757d;
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<div id="navbar"></div>


<!-- CONTENIDO -->
<div class="container mt-5">

  <div class="text-center mb-5">
    <h1 class="titulo">MIEMBROS DE LA USIP</h1>
    <p class="text-success">Personas que formaron parte de la Unidad de Sistemas de Información y Procesos</p>
  </div>

  <div class="row g-4">

    <!-- MIEMBRO -->
    <div class="col-md-4">
      <div class="card card-usip text-center">
        <div class="card-header-usip"></div>
        <div class="card-body">
          <img src="../imagenes/Miembros del equipo/Alexander Samuel Bohorquez Blanco.jpg"
               class="foto-usip"
               alt="Miembro USIP">

          <h5 class="mt-3 nombre">Alexander Samuel Bohorquez Blanco</h5>
          <div class="cargo">Soporte Técnico</div>
          <div class="periodo">Gestión 2025 - 2026</div>
        </div>
      </div>
    </div>

    <!-- MIEMBRO -->
    <div class="col-md-4">
      <div class="card card-usip text-center">
        <div class="card-header-usip"></div>
        <div class="card-body">
          <img src="../imagenes/Miembros del equipo/Alexander Samuel Bohorquez Blanco.jpg"
               class="foto-usip"
               alt="Miembro USIP">

          <h5 class="mt-3 nombre">María López</h5>
          <div class="cargo">Analista de Procesos</div>
          <div class="periodo">Gestión 2021 - 2022</div>
        </div>
      </div>
    </div>

    <!-- MIEMBRO -->
    <div class="col-md-4">
      <div class="card card-usip text-center">
        <div class="card-header-usip"></div>
        <div class="card-body">
          <img src="../imagenes/Miembros del equipo/Alexander Samuel Bohorquez Blanco.jpg"
               class="foto-usip"
               alt="Miembro USIP">

          <h5 class="mt-3 nombre">Carlos Fernández</h5>
          <div class="cargo">Soporte Técnico</div>
          <div class="periodo">Gestión 2020 - 2021</div>
        </div>
      </div>
    </div>

  </div>
</div>
<script src="../accesorios/navbar.js"> </script>
<script>loadNavbar();</script>
</body>
</html>
