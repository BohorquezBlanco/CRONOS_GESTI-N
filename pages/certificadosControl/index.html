<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de certificados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12263A; --ink2:#41586E; --bg:#EDF1F5; --surface:#fff; --line:#D9E1E8;
  --brand:#0E5A6B; --brand-d:#0A4553; --gold:#C8932A;
  --ok:#17784B; --ok-bg:#E3F4EB; --warn:#9A6200; --warn-bg:#FFF1D6;
  --bad:#B3261E; --bad-bg:#FBE7E5; --info:#1F5FA8; --info-bg:#E4EEFA;
  --r:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Instrument Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #6FB7C6;outline-offset:2px}

/* Cabecera */
.top{background:var(--ink);color:#fff;padding:22px 24px 64px}
.top-in{max-width:1280px;margin:auto;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.brand h1{margin:0;font:700 1.5rem "Fraunces",serif;letter-spacing:.2px}
.brand p{margin:2px 0 0;color:#A9BCCB;font-size:.9rem}
.tabs{display:flex;gap:6px;background:#1B3550;padding:4px;border-radius:10px}
.tabs button{border:0;background:none;color:#A9BCCB;padding:8px 16px;border-radius:7px;cursor:pointer;font-weight:600}
.tabs button[aria-pressed=true]{background:#fff;color:var(--ink)}
.year-box{display:flex;gap:8px;align-items:center}
.year-box label{color:#A9BCCB;font-size:.9rem}
.year-box select{background:#1B3550;border:1px solid #34506C;color:#fff;border-radius:8px;padding:8px 12px;min-width:110px}

/* Contenedor */
main{max-width:1280px;margin:-44px auto 40px;padding:0 24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(18,38,58,.08)}

/* Barra de herramientas */
.toolbar{position:sticky;top:0;z-index:5;padding:14px;display:grid;gap:12px;grid-template-columns:minmax(220px,1fr) minmax(180px,260px) minmax(160px,210px) auto auto;align-items:center}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink2)}
.search input{width:100%;padding:11px 12px 11px 40px;border:1px solid var(--line);border-radius:9px;background:#F7F9FB}
.search input:focus{background:#fff;border-color:var(--brand)}
select.f{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#F7F9FB}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#F7F9FB}
.seg button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.btn{border:1px solid transparent;border-radius:9px;padding:10px 16px;cursor:pointer;font-weight:600;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.primary{background:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-d)}
.btn.ghost{background:#fff;border-color:var(--line)}.btn.ghost:hover{background:#F3F6F9}
.btn.danger{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.6;cursor:wait}

/* Resumen */
.stats{display:flex;flex-wrap:wrap;gap:10px;padding:0 14px 14px}
.chip{background:#F3F6F9;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.85rem;color:var(--ink2)}
.chip b{color:var(--ink)}

/* Diplomados */
#content{margin-top:22px;display:grid;gap:26px}
.dip-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 4px 12px;padding-left:14px;border-left:5px solid var(--gold)}
.dip-head h2{margin:0;font:700 clamp(1.3rem,2.6vw,1.9rem)/1.15 "Fraunces",serif}
.dip-head span{color:var(--ink2);font-size:.9rem;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
th{text-align:left;font-weight:600;font-size:.82rem;color:var(--ink2);background:#F6F8FA;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid #EAEFF3;vertical-align:middle}
tbody tr:hover{background:#F9FBFC}
tbody tr:last-child td{border-bottom:0}
.id{color:var(--ink2);font-variant-numeric:tabular-nums}
.name b{display:block}
.name small{color:var(--ink2)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-info{background:var(--info-bg);color:var(--info)}.b-bad{background:var(--bad-bg);color:var(--bad)}
.dates{font-size:.8rem;color:var(--ink2);line-height:1.5;white-space:nowrap}
.dates .del{color:var(--bad);font-weight:600}
tr.deleted td{background:#FDF6F5}
tr.deleted .name,tr.deleted .code,tr.deleted .id{text-decoration:line-through;color:#8C6B68}
.acts{display:flex;gap:6px;justify-content:flex-end}
.icon{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;color:var(--ink2)}
.icon:hover{background:#F3F6F9;color:var(--ink)}
.icon.del:hover{background:var(--bad-bg);color:var(--bad);border-color:#F0C4C0}
.icon.res:hover{background:var(--ok-bg);color:var(--ok);border-color:#BFE3CF}
.obs{max-width:220px;color:var(--ink2);font-size:.88rem}

/* Carga y vacío */
.spin{width:22px;height:22px;border:3px solid #CFE0E5;border-top-color:var(--brand);border-radius:50%;animation:rot .8s linear infinite;display:inline-block}
.btn .spin{width:16px;height:16px;border-width:2px;border-color:rgba(255,255,255,.4);border-top-color:#fff}
@keyframes rot{to{transform:rotate(360deg)}}
.loading{padding:48px 20px;text-align:center;color:var(--ink2);display:grid;gap:12px;justify-items:center}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,#EAEFF3 25%,#F5F8FA 50%,#EAEFF3 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{padding:48px 20px;text-align:center;color:var(--ink2)}
.empty h3{margin:0 0 6px;color:var(--ink);font-family:"Fraunces",serif}

/* Diálogos */
dialog{border:0;border-radius:14px;padding:0;width:min(640px,94vw);box-shadow:0 20px 60px rgba(18,38,58,.35)}
dialog::backdrop{background:rgba(18,38,58,.55)}
.d-head{padding:18px 22px;border-bottom:1px solid var(--line)}
.d-head h3{margin:0;font:700 1.25rem "Fraunces",serif}
.d-body{padding:20px 22px;display:grid;gap:14px;grid-template-columns:1fr 1fr}
.d-body .full{grid-column:1/-1}
.fld label{display:block;font-weight:600;font-size:.85rem;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:10px 12px;border:1px solid #C5D0DA;border-radius:8px;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--brand)}
.fld input.up{text-transform:uppercase}
.hint{font-size:.78rem;color:var(--ink2);margin-top:4px}
.d-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:#F9FBFC;border-radius:0 0 14px 14px}
.err{grid-column:1/-1;background:var(--bad-bg);color:var(--bad);padding:10px 12px;border-radius:8px;font-size:.9rem;font-weight:500}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;max-width:92vw}
#toast.show{opacity:1}
#toast.bad{background:var(--bad)}

@media (max-width:900px){.toolbar{grid-template-columns:1fr 1fr;position:static}.search{grid-column:1/-1}.d-body{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top"><div class="top-in">
  <div class="brand"><h1>Registro de certificados</h1><p>Emisiones por diplomado y gestión</p></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Tipo de programa"></div>
  <div class="year-box">
    <label for="year">Gestión</label>
    <select id="year" aria-label="Gestión"></select>
    <button class="btn ghost" id="btnYear" style="background:#1B3550;color:#fff;border-color:#34506C" title="Crear hoja de una nueva gestión para este tipo">+ Gestión</button>
  </div>
</div></header>

<main>
  <section class="panel">
    <div class="toolbar">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Buscar por nombre, código o diplomado" autocomplete="off">
      </div>
      <select id="dip" class="f" aria-label="Filtrar por diplomado"><option value="">Todos los diplomados</option></select>
      <select id="est" class="f" aria-label="Filtrar por estado"><option value="">Todos los estados</option></select>
      <div class="seg" id="view" role="group" aria-label="Estado del registro">
        <button data-v="activos" aria-pressed="true">Activos</button>
        <button data-v="eliminados" aria-pressed="false">Eliminados</button>
        <button data-v="todos" aria-pressed="false">Todos</button>
      </div>
      <button class="btn primary" id="btnNew">+ Nueva emisión</button>
    </div>
    <div class="stats" id="stats"></div>
  </section>

  <div id="content"></div>
</main>

<!-- Formulario -->
<dialog id="dlg">
  <div class="d-head"><h3 id="dTitle">Nueva emisión</h3></div>
  <div class="d-body" id="dBody">
    <div class="err" id="dErr" hidden></div>
    <div class="fld"><label for="fNom">Nombres</label><input id="fNom" class="up" autocomplete="off"></div>
    <div class="fld"><label for="fApe">Apellidos</label><input id="fApe" class="up" autocomplete="off"></div>
    <div class="fld full"><label for="fDip">Diplomado</label><input id="fDip" class="up" list="dipList" autocomplete="off"><datalist id="dipList"></datalist></div>
    <div class="fld"><label for="fEst">Estado</label>
      <select id="fEst"><option>IMPRESO</option><option>PENDIENTES ADMINISTRATIVOS</option><option>EN PROCESO</option><option>ENTREGADO</option></select></div>
    <div class="fld"><label for="fGes">Gestión (periodo)</label><input id="fGes" placeholder="1/2025"></div>
    <div class="fld full"><label for="fCod">Código</label><input id="fCod" class="up" placeholder="USIP-EP-DIP-DPPP9-A-2025 Nº 001">
      <div class="hint">Debe ser único. Déjalo vacío si aún no tiene código (se guarda como N/A).</div></div>
    <div class="fld full"><label for="fObs">Observación</label><textarea id="fObs" rows="2"></textarea></div>
  </div>
  <div class="d-foot">
    <button class="btn ghost" id="dCancel">Cancelar</button>
    <button class="btn primary" id="dSave">Guardar</button>
  </div>
</dialog>

<!-- Confirmación -->
<dialog id="dlgC">
  <div class="d-head"><h3 id="cTitle">Eliminar registro</h3></div>
  <div class="d-body" style="grid-template-columns:1fr"><div id="cMsg"></div></div>
  <div class="d-foot">
    <button class="btn ghost" id="cNo">Cancelar</button>
    <button class="btn danger" id="cYes">Eliminar</button>
  </div>
</dialog>

<div id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
/* ====== CONFIGURACIÓN ====== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbxidgefcN98qQbvvZL3Pha3RDkM9uqcy_PnsAScwCCDWlSzlleWPu-XjUp-uj1f9BO4/exec',
  TOKEN: '' // el mismo valor de API_TOKEN en Code.gs (opcional)
};
/* Llama al backend de Apps Script. Se envía como text/plain para evitar el preflight de CORS. */
async function run(fn, ...args) {
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    body: JSON.stringify({ fn, args, token: CONFIG.TOKEN })
  });
  const out = await res.json();
  if (!out.ok) throw new Error(out.error || 'Error del servidor');
  return out.data;
}

const S = { tipo: 'D', tipos: {}, sheets: [], year: null, rows: [], q: '', dip: '', est: '', view: 'activos', editing: null };
const IC = {
  edit: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  del: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>',
  res: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>'
};

/* ---------- Carga ---------- */
function loading(msg) {
  $('#content').innerHTML = `<div class="panel loading"><span class="spin"></span><div>${esc(msg || 'Cargando registros…')}</div>
    <div class="skel" style="width:min(520px,80%)"></div><div class="skel" style="width:min(420px,65%)"></div><div class="skel" style="width:min(480px,72%)"></div></div>`;
}
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 3200);
}
const SINGULAR = { D: 'Diplomado', C: 'Curso', M: 'Maestría' };
const sing = () => SINGULAR[S.tipo] || 'Programa';
const yearsOf = t => S.sheets.filter(s => s.tipo === t).map(s => s.year);
async function init() {
  loading('Conectando con la hoja de cálculo…');
  try {
    const r = await run('api_init');
    S.tipos = r.tipos; S.sheets = r.sheets; S.tipo = r.tipo; S.year = r.year; S.rows = r.rows;
    fillTabs(); fillYears(); fillDips(); render();
  } catch (e) { $('#content').innerHTML = `<div class="panel empty"><h3>No se pudo cargar</h3><p>${esc(e.message)}</p></div>`; }
}
async function loadYear(y) {
  S.year = y; S.dip = ''; S.est = ''; S.q = ''; $('#q').value = ''; loading('Cargando ' + S.tipo + '-' + y + '…');
  try { S.rows = await run('api_getRecords', S.tipo, y); fillDips(); render(); }
  catch (e) { $('#content').innerHTML = `<div class="panel empty"><h3>Error</h3><p>${esc(e.message)}</p></div>`; }
}
async function setTipo(t) {
  S.tipo = t; fillTabs(); const ys = yearsOf(t); S.year = ys[0] || null; fillYears(); labels();
  if (S.year) return loadYear(S.year);
  S.rows = []; S.dip = ''; fillDips(); render();
}
function fillTabs() {
  $('#tabs').innerHTML = Object.keys(S.tipos).map(t =>
    `<button role="tab" data-t="${t}" aria-pressed="${t === S.tipo}">${esc(S.tipos[t])}</button>`).join('');
  labels();
}
function labels() {
  $('#dip').options[0].text = 'Todos los ' + (S.tipos[S.tipo] || 'programas').toLowerCase();
  document.querySelector('label[for=fDip]').textContent = sing();
  $('#q').placeholder = 'Buscar por nombre, código o ' + sing().toLowerCase();
}
function fillYears() {
  const ys = yearsOf(S.tipo);
  $('#year').innerHTML = ys.length ? ys.map(y => `<option ${y === S.year ? 'selected' : ''}>${y}</option>`).join('') : '<option value="">Sin hojas</option>';
}
function fillEst() {
  const base = ['IMPRESO', 'EN PROCESO', 'PENDIENTES ADMINISTRATIVOS', 'ENTREGADO'];
  const list = [...new Set([...base, ...S.rows.map(r => r.estado).filter(Boolean)])];
  if (S.est && !list.includes(S.est)) S.est = '';
  $('#est').innerHTML = '<option value="">Todos los estados</option>' +
    list.map(e => `<option value="${esc(e)}" ${e === S.est ? 'selected' : ''}>${esc(e)} (${S.rows.filter(r => !r.eliminacion && r.estado === e).length})</option>`).join('');
}
function fillDips() {
  fillEst();
  const list = [...new Set(S.rows.map(r => r.diplomado).filter(Boolean))].sort();
  $('#dip').innerHTML = `<option value="">Todos los ${(S.tipos[S.tipo] || 'programas').toLowerCase()}</option>` +
    list.map(d => `<option value="${esc(d)}" ${d === S.dip ? 'selected' : ''}>${esc(d)}</option>`).join('');
  $('#dipList').innerHTML = list.map(d => `<option value="${esc(d)}">`).join('');
}

/* ---------- Render ---------- */
function estadoBadge(e) {
  const k = norm(e); const c = k.includes('impres') ? 'b-ok' : k.includes('pendiente') ? 'b-warn' : k.includes('entreg') ? 'b-info' : 'b-info';
  return `<span class="badge ${c}">${esc(e || '—')}</span>`;
}
function render() {
  if (!S.year) { $('#content').innerHTML = `<div class="panel empty"><h3>Aún no hay hojas de ${esc((S.tipos[S.tipo] || '').toLowerCase())}</h3><p>Crea la primera con el botón “+ Gestión” (hoja ${S.tipo}-AAAA).</p></div>`; $('#stats').innerHTML = ''; return; }
  const tokens = norm(S.q).split(/\s+/).filter(Boolean);
  const rows = S.rows.filter(r => {
    if (S.view === 'activos' && r.eliminacion) return false;
    if (S.view === 'eliminados' && !r.eliminacion) return false;
    if (S.dip && r.diplomado !== S.dip) return false;
    if (S.est && r.estado !== S.est) return false;
    const hay = norm(r.nombres + ' ' + r.apellidos + ' ' + r.codigo + ' ' + r.diplomado);
    return tokens.every(t => hay.includes(t));
  });

  const act = S.rows.filter(r => !r.eliminacion);
  $('#stats').innerHTML =
    `<span class="chip">Hoja <b>${S.tipo}-${S.year}</b></span>` +
    `<span class="chip">Activos <b>${act.length}</b></span>` +
    `<span class="chip">Impresos <b>${act.filter(r => norm(r.estado).includes('impres')).length}</b></span>` +
    `<span class="chip">Pendientes <b>${act.filter(r => norm(r.estado).includes('pendiente')).length}</b></span>` +
    `<span class="chip">Eliminados <b>${S.rows.length - act.length}</b></span>` +
    `<span class="chip">Mostrando <b>${rows.length}</b></span>`;

  if (!rows.length) { $('#content').innerHTML = '<div class="panel empty"><h3>Sin resultados</h3><p>Prueba con otra búsqueda o cambia los filtros.</p></div>'; return; }

  const groups = {};
  rows.forEach(r => (groups[r.diplomado || 'SIN ' + sing().toUpperCase()] ||= []).push(r));
  $('#content').innerHTML = Object.keys(groups).sort().map(d => {
    const g = groups[d].sort((a, b) => a.id - b.id);
    return `<section>
      <div class="dip-head"><h2>${esc(d)}</h2><span>${g.length} ${g.length === 1 ? 'emisión' : 'emisiones'}</span></div>
      <div class="panel tbl-wrap"><table>
        <thead><tr><th>ID</th><th>Titular</th><th>Código</th><th>Estado</th><th>Periodo</th><th>Observación</th><th>Fechas</th><th></th></tr></thead>
        <tbody>${g.map(rowHtml).join('')}</tbody></table></div></section>`;
  }).join('');
}
function rowHtml(r) {
  const del = !!r.eliminacion;
  return `<tr class="${del ? 'deleted' : ''}" data-id="${r.id}">
    <td class="id">${r.id}</td>
    <td class="name"><b>${esc(r.nombres)}</b><small>${esc(r.apellidos)}</small></td>
    <td class="code">${esc(r.codigo)}</td>
    <td>${estadoBadge(r.estado)}</td>
    <td>${esc(r.gestion)}</td>
    <td class="obs">${esc(r.observacion)}</td>
    <td class="dates">Creado: ${esc(r.creacion || '—')}<br>Modificado: ${esc(r.modificacion || '—')}${del ? `<br><span class="del">Eliminado: ${esc(r.eliminacion)}</span>` : ''}</td>
    <td><div class="acts">
      ${del ? `<button class="icon res" data-a="res" title="Restaurar" aria-label="Restaurar">${IC.res}</button>`
            : `<button class="icon" data-a="edit" title="Modificar" aria-label="Modificar">${IC.edit}</button>
               <button class="icon del" data-a="del" title="Eliminar" aria-label="Eliminar">${IC.del}</button>`}
    </div></td></tr>`;
}

/* ---------- Formulario ---------- */
const F = { nom: '#fNom', ape: '#fApe', dip: '#fDip', est: '#fEst', ges: '#fGes', cod: '#fCod', obs: '#fObs' };
function openForm(rec) {
  S.editing = rec || null;
  $('#dTitle').textContent = (rec ? 'Modificar emisión · ' : 'Nueva emisión · ') + sing();
  $('#dErr').hidden = true;
  $(F.nom).value = rec?.nombres || ''; $(F.ape).value = rec?.apellidos || '';
  $(F.dip).value = rec?.diplomado || S.dip || ''; $(F.est).value = rec?.estado || 'PENDIENTES ADMINISTRATIVOS';
  $(F.ges).value = rec?.gestion || ('1/' + S.year); $(F.cod).value = rec?.codigo && rec.codigo !== 'N/A' ? rec.codigo : '';
  $(F.obs).value = rec?.observacion || '';
  $('#dlg').showModal(); $(F.nom).focus();
}
async function save() {
  const d = { id: S.editing?.id, nombres: $(F.nom).value, apellidos: $(F.ape).value, diplomado: $(F.dip).value,
    estado: $(F.est).value, gestion: $(F.ges).value, codigo: $(F.cod).value, observacion: $(F.obs).value };
  const b = $('#dSave'); b.disabled = true; b.innerHTML = '<span class="spin"></span> Guardando';
  $('#dErr').hidden = true;
  try {
    S.rows = await run('api_save', S.tipo, S.year, d);
    $('#dlg').close(); fillDips(); render(); toast(S.editing ? 'Cambios guardados' : 'Emisión registrada');
  } catch (e) { $('#dErr').textContent = e.message; $('#dErr').hidden = false; }
  b.disabled = false; b.textContent = 'Guardar';
}

/* ---------- Eliminar / restaurar ---------- */
function confirmBox(title, msg, yesLabel, danger) {
  return new Promise(res => {
    $('#cTitle').textContent = title; $('#cMsg').innerHTML = msg;
    const y = $('#cYes'); y.textContent = yesLabel; y.className = 'btn ' + (danger ? 'danger' : 'primary');
    const d = $('#dlgC'); d.showModal();
    $('#cYes').onclick = () => { d.close(); res(true); };
    $('#cNo').onclick = () => { d.close(); res(false); };
  });
}
async function act(a, id) {
  const r = S.rows.find(x => x.id === id); if (!r) return;
  if (a === 'edit') return openForm(r);
  const del = a === 'del';
  const ok = await confirmBox(del ? 'Eliminar registro' : 'Restaurar registro',
    `<b>${esc(r.nombres)} ${esc(r.apellidos)}</b><br>${esc(r.diplomado)}<br><br>` +
    (del ? 'Se marcará con la fecha de eliminación. Podrás restaurarlo después.' : 'Volverá a estar activo (se validará que no haya duplicados).'),
    del ? 'Eliminar' : 'Restaurar', del);
  if (!ok) return;
  try { S.rows = await run(del ? 'api_delete' : 'api_restore', S.tipo, S.year, id); render(); toast(del ? 'Registro eliminado' : 'Registro restaurado'); }
  catch (e) { toast(e.message, true); }
}

/* ---------- Eventos ---------- */
let tmr;
$('#q').addEventListener('input', e => { clearTimeout(tmr); tmr = setTimeout(() => { S.q = e.target.value; render(); }, 180); });
$('#est').addEventListener('change', e => { S.est = e.target.value; render(); });
$('#dip').addEventListener('change', e => { S.dip = e.target.value; render(); });
$('#year').addEventListener('change', e => loadYear(Number(e.target.value)));
$('#view').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.view = b.dataset.v; document.querySelectorAll('#view button').forEach(x => x.setAttribute('aria-pressed', x === b)); render();
});
$('#content').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  act(b.dataset.a, Number(b.closest('tr').dataset.id));
});
$('#btnNew').addEventListener('click', () => S.year ? openForm() : toast('Primero crea una gestión', true));
$('#dSave').addEventListener('click', save);
$('#dCancel').addEventListener('click', () => $('#dlg').close());
$('#dBody').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') save(); });
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b && b.dataset.t !== S.tipo) setTipo(b.dataset.t); });
$('#btnYear').addEventListener('click', async () => {
  const y = prompt('Año de la nueva gestión (se creará la hoja ' + S.tipo + '-AAAA):', new Date().getFullYear());
  if (!y) return;
  try {
    S.sheets = await run('api_createYear', S.tipo, y); S.year = Number(y); S.rows = []; S.dip = '';
    fillYears(); fillDips(); render(); toast('Hoja ' + S.tipo + '-' + y + ' creada');
  } catch (e) { toast(e.message, true); }
});

init();
</script>
</body>
</html>
