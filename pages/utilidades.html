  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      background: #d3ddc2;
      color: #fff;
    }

        .navbar {
      background-color: #155724 !important;
    }

    .navbar-brand {
      color: #d4edda !important;
      font-weight: bold;
    }

    /* HEADER */
    .header {
      background: #75d43e98;
      padding: 20px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      letter-spacing: 1px;
    }

    /* CONTENEDOR */
    .container {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    /* TARJETAS */
    .card {
      background: #11501a;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .card h3 {
      margin-top: 0;
      color: #ffffff;
    }

    /* BOTONES */
    .btn {
      display: block;
      margin-top: 10px;
      padding: 10px;
      background: linear-gradient(135deg, #709651, #73a571);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      transition: 0.3s;
    }

    .btn:hover {
      opacity: 0.85;
    }

    /* ICONOS (emoji simple pero elegante) */
    .icon {
      font-size: 20px;
      margin-right: 5px;
    }

  </style>
</head>
